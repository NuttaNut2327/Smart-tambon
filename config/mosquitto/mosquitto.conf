# Mosquitto broker for local development (see compose.yaml "mqtt" service)
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Clients must authenticate; the password file is generated at container start
# from MQTT_USERNAME / MQTT_PASSWORD.
allow_anonymous false
password_file /mosquitto/passwd

# Native MQTT
listener 1883
protocol mqtt

# MQTT over WebSockets (browser clients)
listener 9001
protocol websockets
